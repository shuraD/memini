# Memini graph schema, plain (GR-02; graph-archrag SPEC "Graph slices first", owner 2026-11-16).
# Lists only labels, relationship types, each property's name, and `values` where a property
# allows a fixed set. Every node also carries scope, updated_by and updated_at.
# Vocabulary values (domain names, type names, relation names) are data, never listed here.

nodes:
  Project:
    properties: [scope, updated_by, updated_at, name]
  Domain:
    properties: [scope, updated_by, updated_at, name]
  Artifact:
    properties: [scope, updated_by, updated_at, id, type, role, content_hash, summary, labels, status]
    values:
      status: [active, superseded, deleted]
  Chunk:
    properties: [scope, updated_by, updated_at, id, content, line_start, line_end, embedding]
  Entity:
    properties: [scope, updated_by, updated_at, id, name, type, summary, canonical_id, references, labels, embedding, embedding_code, status]
    values:
      status: [active, superseded, deleted]
  Community:
    properties: [scope, updated_by, updated_at, id, level, summary, embedding]
  RelationType:
    properties: [scope, updated_by, updated_at, name]

relationships:
  HAS_DOMAIN: {from: Project, to: Domain}
  CONTAINS: {from: Domain, to: Artifact}
  HAS_CHUNK: {from: Artifact, to: Chunk, properties: [order]}
  HAS_ENTITY: {from: Chunk, to: Entity}
  RELATED_TO:
    from: [Entity, Community]
    to: [Entity, Community]
    properties: [kind, type, description]
    values:
      kind: [extracted, sequence, label, cross_domain, shared]
  SIMILAR: {from: Entity, to: Entity, properties: [score, code_score]}
  CODE_LINK:
    from: Entity
    to: Entity
    properties: [kind, line]
    values:
      kind: [define, call, import]
  SUPERSEDES: {from: [Artifact, Entity], to: [Artifact, Entity]}
  BELONGS_TO_COMMUNITY: {from: [Entity, Community], to: Community}
  HIERARCHICAL_LINK: {from: Community, to: Community, properties: [similarity]}
  INTER_LAYER_LINK: {from: Community, to: [Community, Entity]}
