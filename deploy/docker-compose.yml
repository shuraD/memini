# Local Neo4j for development and tests (GR-01, T55).
#   NEO4J_PASSWORD=... docker compose -f deploy/docker-compose.yml up -d
# GDS and APOC are fetched by the image at the version that matches the server.
services:
  neo4j:
    image: neo4j:2026.09
    container_name: memini-neo4j
    ports:
      - "127.0.0.1:7687:7687"   # Bolt
      - "127.0.0.1:7474:7474"   # Neo4j Browser
    environment:
      # No fallback: compose stops with this message when the variable is unset.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD}"
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "gds.*,apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "gds.*,apoc.*"
    networks:
      - default   # publishes the ports on 127.0.0.1
      - sandbox   # the orchestrator's test sandbox reaches Neo4j here
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"${NEO4J_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

networks:
  sandbox:
    name: memini-test-net
    internal: true   # no route to the internet; only this Neo4j and the sandbox are on it

volumes:
  neo4j_data:
