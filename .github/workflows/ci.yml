# The full gate. Runs locally with `act` (Docker); the same file runs on GitHub if a
# remote is ever added (owner approval required). Fast subset = .githooks/pre-commit.
name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  gate:
    # a fixed runner image: ubuntu-latest moves to Ubuntu 26 from 2026-10-19 (runner-images#14748)
    runs-on: ubuntu-24.04
    steps:
      # every action is pinned to a full commit SHA (repository setting; tests/gates/test_actions_pinned.py)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
      # pull requests: audit the PR head itself, not GitHub's synthetic merge commit. This is a
      # separate step, not a `ref:` input: any `ref:` input (even an empty one) stops act from
      # using its local copy of the repository and makes checkout fetch from github.com.
      - name: "Select the pull request head"
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git checkout --detach "$PR_HEAD_SHA"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - name: Install
        run: uv sync --frozen
      - name: "Audit range (which commits the ledger and commit-message audits check)"
        env:
          AUDIT_EVENT: ${{ github.event_name }}
          AUDIT_BEFORE: ${{ github.event.before }}
          AUDIT_BASE_REF: origin/${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          base="$(uv run python -P tools/ci/audit_range.py)"
          test -n "$base"
          echo "audit base: $base"
          echo "MEMINI_AUDIT_BASE=$base" >> "$GITHUB_ENV"
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types
        run: uv run mypy
      # B-foundation-016: pytest runs in safe-path mode and the step trusts the junit report,
      # not the exit code: every collected test must run and pass, and nothing else may run.
      # The gate itself also runs with -P, by path (it imports only the stdlib), so no root
      # module can shadow its own imports (R3)
      - name: "Tests - sanity, unit, gates + coverage (incl. every bug's regression test)"
        run: uv run python -P tools/ci/pytest_gate.py tests/sanity tests/unit tests/gates -- --cov --cov-report=term-missing:skip-covered
      - name: Architecture contracts
        run: uv run lint-imports --no-cache
      - name: Security
        run: |
          uv run bandit -q -r src tools -ll
          uv run pip-audit
      - name: Dependencies
        run: uv run deptry .
      - name: "Export gate - generic leak check of every tracked file (emails outside the public allow list, RFC 1918 addresses, home paths). The full private-pattern scan runs locally before a snapshot or release, and in the egress gateway."
        run: |
          export_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$export_dir"
          uv run python -m tools.ci.export_gate --generic-only --allow tools/ci/export-allow.txt "$export_dir"
      - name: "Commit identities (author and committer emails on the public allow list; never printed)"
        run: uv run python -m tools.ci.commit_identity --base "$MEMINI_AUDIT_BASE" --names tools/ci/commit-names.txt
      - name: "Ledger guards (features keep tests, fixed bugs keep regression tests, no lost feature, protected checks declared)"
        run: uv run python -m tools.ci.check_ledgers --stage ci --base "$MEMINI_AUDIT_BASE"
      - name: "Commit messages (Requirement / Implemented / Why, Change-Author) on every commit of the audit range"
        run: |
          uv run python -P tools/ci/audit_range.py --check "$MEMINI_AUDIT_BASE"  # fail closed
          if [ "$MEMINI_AUDIT_BASE" = ROOT ]; then range=HEAD; else range="$MEMINI_AUDIT_BASE..HEAD"; fi
          echo "auditing $(git rev-list --count "$range") commit(s)"
          for sha in $(git rev-list --reverse "$range"); do
            git log -1 --format=%B "$sha" > /tmp/msg.txt
            uv run python -m tools.ci.check_ledgers --stage commit-msg /tmp/msg.txt || exit 1
          done
      # TEMPORARY relaxation (owner, relayed by vp-rnd, 2026-11-14: "Approve"): the review
      # files are private (ADR-0002), so pushes to main skip this step. Remove this `if:` when
      # T-059 lands (the review verdict becomes a required check from the reviewer App).
      # T-059 must land before agents get GitHub access.
      - name: "Merge gate - review verdict verified (standards, expected vs implemented, knowledge drift)"
        if: github.event_name == 'pull_request'
        run: uv run python -m tools.ci.review_gate
      - name: "Merge gate - acceptance benchmark (opt-in; needs local Neo4j and model providers)"
        if: env.MEMINI_ACCEPTANCE == '1'
        run: MEMINI_ACCEPTANCE=1 uv run python -m pytest tests/acceptance -q
