# Orchestrator defaults (atomic slice workflow, owner 2026-11-14).
# Override with --config <file.toml> or MEMINI_ORCH_CONFIG; single paths also by env:
# MEMINI_ORCH_STATE_DIR, MEMINI_ORCH_HOLDOUT_DIR, MEMINI_ORCH_WORKTREES_DIR,
# MEMINI_ORCH_INBOX, MEMINI_ORCH_QUEUE. Relative paths resolve against the repository root.
# The state, hold-out, inbox and queue must lie outside the repository and every worktree.

main_branch = "main"
branch_prefix = "orch/"
worker = "default"
default_engine = "claude"
# engine per role; empty = automatic: a different engine from the coder's when one in
# engine_preference is installed, else the coder's. QA and audit stay on Claude by default:
# only Claude loads the guard hook (the hold-out and private dirs stay unread) and runs the
# audit with no tools at all (--tools "").
qa_engine = "claude"
# Until the microVM executor exists the hold-out is NOT secret from a malicious coder: the
# guard hook only warns a cooperative Claude, and coder code run by a gate can read any file
# this user can. The defences until then are the deny-pattern scan, the one-shot audit and
# the diff the owner sees. Non-Claude coders are refused while the executor is "local".
coder_engine = ""
# engines allowed to code while executor = "local"
local_coder_engines = ["claude"]
audit_engine = "claude"
engine_preference = ["claude", "gemini", "opencode"]
# Where coder-written code runs. "docker" (the default when docker is available) runs every
# such command in a fresh --network none container with an allow-listed environment and no
# host mount; "local" (a subprocess in the worktree) stays for the orchestrator's own tests
# and fixtures. Empty = "docker" if `docker info` succeeds, else "local".
executor = ""
# docker sandbox
docker_cli = "docker"
docker_image = "memini-orchestrator-sandbox"   # tagged by the uv.lock hash
dockerfile = "tools/orchestrator/Dockerfile"
docker_memory = "2g"
docker_pids = 512
docker_run_timeout_s = 1800
# pytest markers skipped in the sandbox and reported, never hidden: integration tests need the
# test Neo4j. The orchestrator deselects them with -m and says so, unless sandbox_network is set.
sandbox_skip_markers = ["integration"]
# Test Neo4j for the sandbox. Empty = no network (--network none) and integration tests are
# skipped. Set it to the internal network of deploy/docker-compose.yml ("memini-test-net": no
# internet, only that Neo4j on it) and the sandbox joins it with NEO4J_URI, NEO4J_USER and
# NEO4J_PASSWORD (the password from the orchestrator's own environment). Tests isolate
# themselves by their own `scope` value; there is no per-slice database.
sandbox_network = "memini-test-net"
sandbox_neo4j_uri = "bolt://memini-neo4j:7687"
sandbox_neo4j_user = "neo4j"
# Slice flow (owner 2026-11-17): the coder sees the hidden tests in full and may edit a test that
# contradicts the spec or the gate rules, in its own branch. The orchestrator keeps the original
# sealed tests, stores the diff of every test change, and after the gates pass a QA review stage
# returns approve or reject with a reason. One reject sends the slice back to the coder once; a
# second goes to the owner. Every step is logged in <state_dir>/ops-ledger.jsonl.
# false = the old flow (tests sealed, hold-out hidden); the old-flow tests pin it explicitly.
# Default on since the owner's approval of 2026-11-17.
test_review = true
# The squads' card files (<cards_dir>/<squad>/CARD.md, and <cards_dir>/../capabilities/*.md for the
# old code's evidence): the ready gate reads them (D1).
cards_dir = "../memini-internal-mvp/squads"
# D12 (FLOW-HARD): in these paths a string literal equal to a graph name of config/graph_schema.yaml
# is refused; use the typed names. Only the files a slice changes are scanned.
graph_name_paths = ["src/memini/infra/graph/", "src/memini/core/archrag/"]
# interpreter for the host-side hold-out run; empty = the orchestrator's own interpreter
holdout_python = ""

# Deny scan: every line the coder ADDS is matched against these regexes; one hit rejects the
# slice. They catch in-process result forging (patching pytest, writing a fake junit report,
# exiting early), process and interpreter control. A slice that truly needs one of them is
# an owner decision, not a coder's.
deny_patterns = [
  '_pytest', '\bpytest\b', 'conftest', 'junit', 'os\._exit', '\bsys\.exit\b',
  '\bos\.(kill|abort|system|popen|spawn\w*|exec\w*|fork\w*)\b', 'sys\.argv',
  'gc\.get_(objects|referrers|referents)', 'pluginmanager', '\bpluggy\b', '\batexit\b',
  '\bsubprocess\b', '\bctypes\b', '\bcffi\b', '\bexec\s*\(', '\beval\s*\(',
  '\bcompile\s*\(', '\bimportlib\b', '__import__', 'sys\.modules', '\bbuiltins\b',
  '__builtins__', 'sys\.(settrace|setprofile|_getframe|addaudithook|meta_path|path_hooks)',
  'inspect\.(stack|currentframe|getframeinfo|getouterframes)', '\bsignal\.', '\bmultiprocessing\b', '\bpty\.|import pty', '\bmarshal\b',
  '\bpickle\b', '\bsocket\b', 'sitecustomize|usercustomize|site-packages', '\.pth\b', 'PYTEST_', 'COV_CORE',
  '\bglobals\s*\(', '\bsetattr\s*\(\s*(sys|os|builtins)\b', '\bcode\.(interact|InteractiveConsole)',
  '\b(enable_)?load_extension\b',
]

# AST check of every Python file the coder changed (the main layer; deny_patterns is the
# extra one). It rejects getattr/setattr/delattr/hasattr with a non-literal name, the calls
# below, dunder attributes outside ast_dunder_allow, dunder names outside ast_dunder_names,
# imports outside import_allow (+ memini + the declared dependencies), and forbidden names.
# Only an owner inbox line "OVERRIDE-AST <task id> <commit sha>" lets a rejected commit pass.
ast_forbidden_calls = ["exec", "eval", "compile", "__import__", "vars", "globals", "locals", "breakpoint"]
ast_dunder_allow = [
  "__name__", "__class__", "__init__", "__post_init__", "__repr__", "__str__", "__eq__", "__hash__",
]
# dunder NAMES a module may read or define (not attributes): module metadata and paths
ast_dunder_names = ["__name__", "__file__", "__all__", "__version__", "__doc__", "__slots__"]
# owner 2026-11-15 ("agree for AST list"): infra slices need SQLite, threads, HTTP and
# Retry-After dates (LP-02, LP-08); their dangerous corners are in forbidden_names below
import_allow = [
  "__future__", "abc", "array", "base64", "bisect", "collections", "contextlib", "copy", "csv",
  "dataclasses", "datetime", "decimal", "difflib", "enum", "fractions", "functools", "graphlib",
  "hashlib", "heapq", "html", "io", "itertools", "json", "logging", "math", "numbers",
  "operator", "os", "pathlib", "pprint", "random", "re", "secrets", "statistics", "string",
  "struct", "sys", "textwrap", "time", "tomllib", "typing", "unicodedata", "urllib.parse",
  "uuid", "warnings", "zlib", "memini",
  "sqlite3", "threading", "contextvars", "queue", "types", "concurrent.futures",
  "urllib.request", "urllib.error", "http.client", "email.utils",
  "ast", "html.parser",  # owner 2026-11-16: the old memini parsed Python and HTML with them (card I35, I37)
]
# dotted names (fnmatch) that stay forbidden inside allowed modules
forbidden_names = [
  "os._exit", "os.abort", "os.kill*", "os.system", "os.popen", "os.fork*", "os.exec*",
  "os.spawn*", "os.posix_spawn*", "os.startfile", "os.putenv", "os.register_at_fork",
  "sys.modules", "sys.argv", "sys.orig_argv", "sys.exit", "sys._getframe", "sys.settrace",
  "sys.setprofile", "sys.meta_path", "sys.path_hooks", "sys.path_importer_cache",
  "sys.addaudithook", "sys.breakpointhook", "sys.excepthook", "sys.displayhook",
  "sys.stdin", "sys.stdout", "sys.stderr", "sys.__*", "logging.config*",
  # no new processes, no hand-built code or frames, no hooks into other threads
  "concurrent.futures.process*", "concurrent.futures.ProcessPoolExecutor",
  "types.CodeType", "types.FunctionType", "types.LambdaType", "types.FrameType",
  "types.ModuleType", "threading.settrace*", "threading.setprofile*", "threading.excepthook",
  "threading._*",
]

# the coder may change only these paths (a trailing "/" is a directory) ...
allow = ["src/memini/"]
# ... except these, which win over the allow list (and are blocked by the guard hook)
protected = ["src/memini/infra/flags.py"]
# the guard hook also blocks these for the coder (early warning; the path gate decides)
guard_protected = [
  "tests/", "tools/", "ledgers/", ".github/", ".githooks/", "config/", "docs/",
  "pyproject.toml", "uv.lock", "**/conftest.py", "**/pytest.ini", "**/setup.cfg",
]
# a module is <root><first path component>; a spec's paths must lie inside one module,
# and the root names the ledger layer of the feature row written on merge
module_roots = { "src/memini/core/" = "core", "src/memini/extensions/" = "extensions", "src/memini/infra/" = "infra" }
# untracked or ignored files an agent may leave outside its paths (caches and its venv);
# anything else rejects the step. Gates never run in an agent worktree anyway.
ignored_ok = ["__pycache__/", ".pytest_cache/", ".mypy_cache/", ".ruff_cache/", ".venv/"]
# the QA agent may only ADD test files (test_*.py) under these
qa_allow = ["tests/unit/"]

state_dir = "../.memini-orchestrator"
holdout_dir = "../memini-holdout"         # hold-out tests: <holdout_dir>/<TASK-ID>/test_*.py
worktrees_dir = "../memini-orchestrator-worktrees"
inbox = "../.memini-orchestrator/OWNER_INBOX.md"
queue = "../.memini-orchestrator/queue.txt"
prompts_dir = ""                           # empty: the prompts next to this file
# The stage chain (owner 2026-11-15: "we can have more than 2 queues"). Each stage has its own
# queue; a task that passes a stage's checks moves into the queue of its `next` stage. "code"
# is the slice pipeline above (QA tests, coder, gates, hold-out, audit, merge) and reads
# `queue`. Stages run side by side: run-queue --stage <name>, or --all.
spec_dir = "../memini/docs/internal/slices"  # the spec stage writes <spec_dir>/<module>/<ID>.md
# (the [[stages]] tables are at the end of this file)
holdout_required = true

python = ".venv/bin/python"                # relative paths resolve inside each worktree
setup = [["uv", "sync", "--frozen"]]        # run in every new worktree
# pytest arguments for the QA and hold-out runs; they run through tools/ci/pytest_gate.py
# (the orchestrator's own copy), so only a junit report showing every collected test passed
# counts, never the exit code
pytest_args = ["-o", "addopts=", "-p", "no:cacheprovider"]
# lint run on QA's test files before they are sealed ({files} = those files); a failure gives QA
# one retry, then rejects the slice before any coder runs (LP-02, 2026-11-15)
qa_lint = [
  ["{python}", "-m", "ruff", "check", "{files}"],
  ["{python}", "-m", "ruff", "format", "--check", "{files}"],
]
# a merge gate that can fail on QA's sealed files must check them before sealing, or the slice
# can never merge (LP-05: gitleaks found QA's fake key only at merge). Run once per file
# ({file}), only when the gate of that name is configured.
qa_gate_checks = { gitleaks = ["gitleaks", "dir", "--no-banner", "--no-color", "--redact", "-v", "{file}"] }
# the only variables any executor or host run sees (no API keys, no MEMINI_ORCH_*); an
# engine adds its own list (engines.<name>.env) for its agent steps only
env_allow = [
  "PATH", "HOME", "USER", "LOGNAME", "SHELL", "LANG", "LC_ALL", "LC_CTYPE", "TERM", "TMPDIR",
  "TZ", "UV_CACHE_DIR", "UV_PYTHON_INSTALL_DIR", "XDG_CACHE_HOME",
]

# `reference: [<repo>@]<branch>` in a spec is read-only context for the coder only. <repo>
# is a name from this table (or a path); the orchestrator never fetches, copies or merges it.
reference_tools = "Bash(git -C {repo} show *),Bash(git -C {repo} diff *),Bash(git -C {repo} log *)"

max_coder_attempts = 2
merge_retries = 3
# slices that may run at once (owner 2026-11-15: many agents, not one serial line). Above 1 only
# with the docker executor, where coder code cannot reach the host's state or git refs; the
# local executor always runs one slice at a time. Each run is its own process with one-shot
# agents, so the cost rate grows with this number.
max_parallel = 8  # 2 squads x 4 (owner 2026-11-15: dev squads)
engine_timeout_s = 1800
gate_timeout_s = 1800
max_budget_usd = "3"
# a test gate whose output matches this fails: zero skips
forbid_output = '\b\d+ (skipped|xfailed|xpassed)\b'  # deselection is ours (sandbox markers)

# import name of a declared dependency when it differs from the distribution name
[dependency_modules]
pyyaml = "yaml"

[reference_repos]
# private = "../memini"

# Author and committer of the one squash commit. Empty = the repository's own git
# user.name / user.email (owner 2026-11-15: every commit is authored by the owner with their
# GitHub noreply address; the exact value is set here when the owner provides it). No
# Co-Authored-By line is ever added.
[identity]
name = ""
email = ""

# env profiles: each profile-aware gate (QA tests, hold-out, gates with profiles = true)
# runs once per profile. all_flags = true sets every flag the flags file reads to on_value.
[flags]
file = "src/memini/infra/flags.py"
function = "_env_bool"
on_value = "1"

[profiles.defaults]
env = {}

[profiles.all-flags-on]
all_flags = true          # the flags file must exist: a missing file fails the task

# Not mirrored from ci.yml: "Select the pull request head" and "Audit range" (CI plumbing;
# the orchestrator sets MEMINI_AUDIT_BASE itself), "Merge gate - review verdict" (the review
# files are private, ADR-0002, and the one-shot diff audit takes that role here) and
# "Merge gate - acceptance benchmark" (opt-in in CI too: needs local Neo4j and model calls).
# Gates: a ci_step is the `run:` of the ci.yml step whose name starts with it (the same
# commands CI runs); `run` is an argv. Placeholders: {base} {python} {workdir}.
# Stages: "slice" (the coder's work, before the audit), "merge" (the squash commit).
[[gates]]
name = "format"
ci_step = "Format"
stages = ["slice", "merge"]

[[gates]]
name = "lint"
ci_step = "Lint"
stages = ["slice", "merge"]

[[gates]]
name = "types"
ci_step = "Types"
stages = ["slice", "merge"]

[[gates]]
# the unit suite: product tests with src coverage, in the sandbox because they run coder code.
# Owner 2026-11-17 (D-9): no full suite for each slice. A slice runs its own tests and its hidden
# tests; this suite runs once per batch, with the last slice of the queue ("batch" stage).
name = "tests"
run = ["{python}", "-P", "tools/ci/pytest_gate.py", "tests/sanity", "tests/unit", "--", "--cov=src", "--cov-report=term-missing:skip-covered"]
stages = ["batch"]
profiles = true
forbid_output = true
sandbox = true

[[gates]]
name = "architecture"
ci_step = "Architecture contracts"
stages = ["slice", "merge"]

[[gates]]
name = "security"
ci_step = "Security"
stages = ["slice", "merge"]

[[gates]]
name = "dependencies"
ci_step = "Dependencies"
stages = ["slice", "merge"]

[[gates]]
name = "export"
ci_step = "Export gate"
stages = ["slice", "merge"]

[[gates]]
name = "identities"
ci_step = "Commit identities"
stages = ["merge"]

[[gates]]
name = "ledger"
ci_step = "Ledger guards"
stages = ["merge"]

[[gates]]
name = "commit-messages"
ci_step = "Commit messages"
stages = ["merge"]

[[gates]]
name = "gitleaks"
run = ["gitleaks", "git", "--no-banner", "--redact", "--log-opts={base}..HEAD", "."]
stages = ["merge"]

# Engines: argv per role. Placeholders (whole argument): {prompt} {settings} {workdir}
# {max_budget_usd}; inside an argument: {reference_tools} (empty without a reference).
# stdin = true sends the prompt on stdin. Only Claude loads the guard hook (--settings);
# the path gate covers every engine.
[engines.claude]
author = "Claude"
env = ["ANTHROPIC_API_KEY", "ANTHROPIC_BASE_URL", "CLAUDE_CONFIG_DIR"]
stdin = true
qa = [
  "claude", "-p", "--settings", "{settings}", "--setting-sources", "",
  "--strict-mcp-config", "--permission-mode", "dontAsk", "--permission-prompts", "none",
  "--allowedTools", "Read,Glob,Grep,Edit,Write,Bash(uv run python -m tools.orchestrator sandbox-pytest *),Bash(uv run ruff *)",
  "--no-session-persistence", "--output-format", "json", "--max-budget-usd", "{max_budget_usd}",
]
coder = [
  "claude", "-p", "--settings", "{settings}", "--setting-sources", "",
  "--strict-mcp-config", "--permission-mode", "dontAsk", "--permission-prompts", "none",
  "--allowedTools", "Read,Glob,Grep,Edit,Write,Bash(uv run python -m tools.orchestrator sandbox-pytest *),Bash(uv run ruff *),Bash(uv run mypy *){reference_tools}",
  "--no-session-persistence", "--output-format", "json", "--max-budget-usd", "{max_budget_usd}",
]
audit = [
  "claude", "-p", "--setting-sources", "", "--strict-mcp-config",
  "--permission-mode", "dontAsk", "--permission-prompts", "none", "--tools", "",
  "--no-session-persistence", "--output-format", "json", "--max-budget-usd", "{max_budget_usd}",
]

[engines.gemini]
author = "Gemini"
env = ["GEMINI_API_KEY", "GOOGLE_API_KEY", "GOOGLE_CLOUD_PROJECT", "GOOGLE_GENAI_USE_VERTEXAI"]
stdin = false
qa = ["gemini", "--approval-mode", "auto_edit", "-p", "{prompt}"]
coder = ["gemini", "--approval-mode", "auto_edit", "-p", "{prompt}"]
audit = ["gemini", "--approval-mode", "plan", "-p", "{prompt}"]

[engines.opencode]
author = "OpenCode"
env = ["OPENCODE_CONFIG"]
stdin = false
qa = ["opencode", "run", "--dir", "{workdir}", "{prompt}"]
coder = ["opencode", "run", "--dir", "{workdir}", "{prompt}"]
audit = ["opencode", "run", "--dir", "{workdir}", "--agent", "plan", "{prompt}"]

# --- stage chain (see spec_dir above) --------------------------------------------------------
[[stages]]
# a task line -> its spec and hidden (hold-out) tests, written by one QA agent from the sources
name = "spec"
queue = "../.memini-orchestrator/queue-spec.txt"
next = "code"
prompt = "spec"

# --- dev squads: one coding queue per work unit, each run by its own dev session ------------
# (owner 2026-11-15: "dev squads, we simply give the relevant working unit"):
#   run-queue --queue <unit> --workers N
# The spec stage hands a finished task to the queue whose modules contain its module; a task
# that matches none goes to `queue`. Dependencies may lie in another unit's queue. All squads
# share the max_parallel run slots of this machine.
[code_queues.llm-providers]
queue = "../.memini-orchestrator/queue.txt"
modules = ["src/memini/infra/llm_providers/"]

[code_queues.graph-schema]
queue = "../.memini-orchestrator/queue-graph-schema.txt"
modules = ["src/memini/infra/graph/", "src/memini/core/archrag/", "deploy/", "config/graph_schema.yaml"]

[code_queues.query]
queue = "../.memini-orchestrator/queue-query.txt"
modules = ["src/memini/core/query/"]

[code_queues.ingest-units]
queue = "../.memini-orchestrator/queue-ingest-units.txt"
modules = ["src/memini/core/units/", "src/memini/infra/ingest/", "src/memini/core/ingest/"]

# Role sessions (D-10): each role runs its own queue with its own workers, started by its own
# session (MEMINI_ROLE). A role's queue is one of the code_queues above or a stage; the
# planner and devops have none: they work through the moves of tasks sent to them.
[roles.dev1]
queue = "llm-providers"
workers = 4

[roles.dev2]
queue = "query"
workers = 4

[roles.dev3]
queue = "ingest-units"
workers = 4

[roles.dev4]
queue = "graph-schema"
workers = 4

[roles.qa]
queue = "spec"
workers = 2

[roles.planner]
workers = 1

[roles.vp-rnd]
workers = 1

[roles.devops]
workers = 1
